name: Build Mobile Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - 'packages/mobile/**'
  pull_request:
    paths:
      - 'packages/mobile/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: packages/mobile
        run: bun install

      - name: Type check
        working-directory: packages/mobile
        run: bun run typecheck

      - name: Verify Expo configuration
        working-directory: packages/mobile
        run: |
          bunx expo config --type prebuild --json > config.json
          echo "Expo config generated successfully"

  build-android:
    runs-on: ubuntu-latest
    needs: test-build
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS CLI
        run: npm install -g @expo/eas-cli

      - name: Install dependencies
        working-directory: packages/mobile
        run: bun install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        working-directory: packages/mobile
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            eas build --platform android --profile production --non-interactive --wait
          else
            eas build --platform android --profile preview --non-interactive --wait
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download APK
        working-directory: packages/mobile
        run: |
          # Get the latest build URL and download it
          BUILD_URL=$(eas build:list --platform android --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          if [ "$BUILD_URL" != "null" ] && [ "$BUILD_URL" != "" ]; then
            mkdir -p build
            curl -o build/opencode-mobile.apk "$BUILD_URL"
          else
            echo "No build URL found"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-android
          path: packages/mobile/build/opencode-mobile.apk
          retention-days: 30

  build-ios:
    runs-on: macos-latest
    needs: test-build
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup EAS CLI
        run: npm install -g @expo/eas-cli

      - name: Install dependencies
        working-directory: packages/mobile
        run: bun install

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS IPA
        working-directory: packages/mobile
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            eas build --platform ios --profile production --non-interactive --wait
          else
            eas build --platform ios --profile preview --non-interactive --wait
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Download IPA
        working-directory: packages/mobile
        run: |
          # Get the latest build URL and download it
          BUILD_URL=$(eas build:list --platform ios --limit 1 --json | jq -r '.[0].artifacts.buildUrl')
          if [ "$BUILD_URL" != "null" ] && [ "$BUILD_URL" != "" ]; then
            mkdir -p build
            curl -o build/opencode-mobile.ipa "$BUILD_URL"
          else
            echo "No build URL found"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-ios
          path: packages/mobile/build/opencode-mobile.ipa
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: opencode-mobile-android
          path: ./artifacts/android/

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: opencode-mobile-ios
          path: ./artifacts/ios/

      - name: Get package version
        id: package-version
        working-directory: packages/mobile
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ steps.package-version.outputs.version }}
          name: OpenCode Mobile v${{ steps.package-version.outputs.version }}
          body: |
            ## OpenCode Mobile App Release
            
            ### Features
            - iOS and Android clients for OpenCode server
            - Server endpoint configuration
            - JWT-based authentication
            - Real-time chat with AI coding assistant
            - Support for all OpenCode modes and providers
            
            ### Downloads
            - **Android**: Download the APK file below
            - **iOS**: Download the IPA file below (requires TestFlight or sideloading)
            
            ### Setup
            1. Install the app on your device
            2. Configure your OpenCode server endpoint
            3. Authenticate with your credentials
            4. Start coding with AI assistance!
          draft: false
          prerelease: false
          files: |
            ./artifacts/android/opencode-mobile.apk
            ./artifacts/ios/opencode-mobile.ipa